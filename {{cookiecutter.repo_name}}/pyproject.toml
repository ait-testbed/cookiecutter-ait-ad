[project]
name = "{{ cookiecutter.dist_name }}"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = "EUPL-1.2"
license-files = ["LICENSE.md"]
authors = [
    {name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"},
]
maintainers = [
    {name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"},
]
keywords = []
dynamic = ["version"]

dependencies = [
]

[project.optional-dependencies]
# extras, e.g. uv sync --extra full
# full = []

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mike>=2.2.0",
    "mkdocs>=1.6.0",
    "pymdown-extensions>=10.0",
    "prek>=0.4.11",
    "pytest>=9.1.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
]

{%- if cookiecutter.use_cli %}
[project.scripts]
{{ cookiecutter.cli_name }} = "{{ cookiecutter.package_name }}.cli:main"
{%- endif %}

[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_org }}/{{ cookiecutter.repo_name }}"
Documentation = "https://{{ cookiecutter.github_org }}.github.io/{{ cookiecutter.repo_name }}/latest/"
Repository = "https://github.com/{{ cookiecutter.github_org }}/{{ cookiecutter.repo_name }}"
Issues = "https://github.com/{{ cookiecutter.github_org }}/{{ cookiecutter.repo_name }}/issues"
Changelog = "https://github.com/{{ cookiecutter.github_org }}/{{ cookiecutter.repo_name }}/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "{{ cookiecutter.package_name }}.metadata.__version__"}

[tool.isort]
line_length = 110
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["{{ cookiecutter.package_name }}"]
src_paths = ["src", "tests"]

[tool.deptry]
known_first_party = ["{{ cookiecutter.package_name }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.mypy]
strict = true
ignore_missing_imports = true
